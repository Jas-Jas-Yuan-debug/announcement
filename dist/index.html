<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#173e37"><meta name="description" content="Clear classroom announcements. Type a message or choose a preset, then hear a chime and your announcement."><title>Classroom Chime</title><link rel="icon" href="favicon.svg"><link rel="stylesheet" href="style.css"></head>
<body><main>
<header><a class="brand" href="./"><span class="brandmark">♪</span> Classroom Chime</a></header>
<div class="workspace"><section class="composer" aria-labelledby="message-heading"><div class="section-top"><h2 id="message-heading">Message</h2></div><label class="sr-only" for="message">Announcement text</label><textarea id="message" maxlength="3000" placeholder="Type a message…"></textarea><div class="text-footer"><span>Chime + voice</span><span id="count">0 / 3000</span></div><div class="voice-settings"><label for="voice">Voice</label><div class="voice-row"><select id="voice" aria-label="Voice"><option value="">Loading voices…</option></select><button id="preview" type="button">Preview</button></div><div class="rate-label"><label for="rate">Speed</label><output id="rate-value" for="rate">1×</output></div><input id="rate" type="range" min="0.5" max="2" step="0.1" value="1" aria-label="Speech speed"><div class="rate-limits"><span>0.5×</span><span>2×</span></div></div><div class="repeat-row"><label for="repeat">Repeat</label><input id="repeat" type="number" min="1" max="1000" step="1" value="1" aria-label="Playback count"><span>times</span></div><div class="actions"><button id="speak" class="primary" disabled><span>▶</span> Chime & speak</button><button id="stop" class="stop" disabled>■ Stop</button></div><p class="status" id="status" role="status" aria-live="polite">Ready.</p></section>
<section class="presets" aria-labelledby="presets-heading"><div class="section-top"><h2 id="presets-heading">Quick announcements</h2></div>
<button class="preset" data-preset="0" data-announcement="Voice level 0, any person in violation shall be subject to a fine of 1BB."><span class="number">01</span><span class="preset-copy"><strong>Voice level 0</strong><span>Fine: 1BB</span></span><span class="play">▶</span></button>
<button class="preset" data-preset="1" data-announcement="Continue doing Freckle, the minimum time required is 60 minutes."><span class="number">02</span><span class="preset-copy"><strong>Continue Freckle</strong><span>At least 60 minutes</span></span><span class="play">▶</span></button>
<button class="preset" data-preset="2" data-announcement="Group 1, put back your iPads and line up, voice level 0."><span class="number">03</span><span class="preset-copy"><strong>Group 1, line up</strong><span>Return iPads · Voice level 0</span></span><span class="play">▶</span></button>
</section></div>
</main><script src="app.js"></script></body></html>
